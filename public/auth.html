<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | RSR</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-body">
<main class="auth-shell">
  <section class="auth-info">
    <a class="brand" href="/"><span class="brand-logo">R</span><span><strong>RECK SHOP</strong><small>Customer Account</small></span></a>
    <h1>Your orders in one private dashboard.</h1>
    <p>Register with your email and a new shop password. Never use or enter your Roblox password.</p>
    <ul><li>Private customer dashboard</li><li>Recent order history</li><li>Quick access to tracking and support chat</li></ul>
  </section>
  <section class="auth-card">
    <div class="auth-tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Register</button></div>
    <form id="loginForm">
      <h2>Welcome back</h2>
      <div class="form-group"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div>
      <div class="form-group"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
      <button class="primary-button">Login</button>
    </form>
    <form id="registerForm" class="hidden">
      <h2>Create account</h2>
      <div class="form-group"><label>Full Name</label><input id="registerName" autocomplete="name"></div>
      <div class="form-group"><label>Email</label><input id="registerEmail" type="email" autocomplete="email"></div>
      <div class="form-group"><label>Password</label><input id="registerPassword" type="password" autocomplete="new-password"></div>
      <div class="form-group"><label>Confirm Password</label><input id="registerConfirm" type="password" autocomplete="new-password"></div>
      <button class="primary-button">Register</button>
    </form>
    <p id="authMessage" class="message"></p>
  </section>
</main>
<script src="auth.js"></script>
</body></html>
