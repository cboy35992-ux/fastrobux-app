<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | RSR</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><a class="brand" href="/"><span class="logo">R</span><span><b>RECK SHOP</b><small>Admin</small></span></a><nav><a href="/">Shop</a><span>Unread <span id="unreadBadge" class="badge hidden">0</span></span></nav></header><main class="container"><section class="panel"><h1>Admin Login</h1><div class="search-row"><input id="key" type="password" placeholder="ADMIN_KEY"><button id="login">Open Dashboard</button></div><p id="loginMessage" class="message"></p></section><div id="area" class="hidden"><section class="stats-grid"><article><span>Total Orders</span><strong id="totalOrders">0</strong></article><article><span>Pending</span><strong id="pendingOrders">0</strong></article><article><span>Completed</span><strong id="completedOrders">0</strong></article><article><span>Revenue</span><strong id="revenue">₱0</strong></article></section><section class="panel"><h2>Store Settings</h2><div class="two-columns"><label>Instant Stock<input id="stock" type="number"></label><label>Support Text<input id="supportText"></label><label>CT Rate<input id="rateCt" type="number" step=".01"></label><label>NCT Rate<input id="rateNct" type="number" step=".01"></label><label>Instant Rate<input id="rateInstant" type="number" step=".01"></label><label>Gifting Rate<input id="rateGifting" type="number" step=".01"></label><label>PayPal Email<input id="paypalEmail"></label><label>Wise Details<input id="wiseDetails"></label><label>Payoneer Details<input id="payoneerDetails"></label></div><label class="confirm"><input id="supportOnline" type="checkbox"> Support Online</label><button id="saveSettings" class="button primary full">Save Settings</button></section><section class="panel"><h2>Promo Codes</h2><div class="two-columns"><label>Code<input id="promoNewCode"></label><label>Discount Type<select id="promoType"><option value="percent">Percent</option><option value="fixed">Fixed PHP</option></select></label><label>Discount Value<input id="promoValue" type="number"></label><label>Minimum Payment<input id="promoMinimum" type="number"></label><label>Maximum Uses<input id="promoMax" type="number"></label><label>Expires At<input id="promoExpires" type="datetime-local"></label></div><button id="createPromo" class="button secondary">Create Promo</button><div id="promoList" class="orders-list"></div></section><section class="admin-grid"><section class="panel"><div class="order-header"><h2>Orders</h2><button id="refresh">Refresh</button></div><div class="search-row"><input id="search" placeholder="Order, username or reference"><button id="searchButton">Search</button></div><label>Status Filter<select id="statusFilter"><option value="">All</option><option>Pending Payment Review</option><option>Approved</option><option>Processing</option><option>Ready for Delivery</option><option>Completed</option><option>Declined</option></select></label><div id="orders" class="orders-list"></div></section><section id="selectedPanel" class="panel hidden"><div class="order-header"><div><h2 id="selectedNumber"></h2><span id="selectedStatus" class="status-pill"></span></div><a id="adminReceipt" class="button secondary" target="_blank">Receipt</a></div><div id="selectedDetails" class="details-grid"></div><div class="status-actions"><button data-status="Approved">Approve</button><button data-status="Processing">Processing</button><button data-status="Ready for Delivery">Ready</button><button data-status="Completed">Complete</button><button class="danger" data-status="Declined">Decline</button></div><div id="adminMessages" class="chat-box"></div><div class="search-row"><input id="adminChat"><button id="adminSend">Reply</button></div></section></section><section class="panel"><h2>Review Moderation</h2><div id="reviewList" class="orders-list"></div></section><section class="panel"><h2>Last 30 Days</h2><div class="table-wrap"><table class="analytics-table"><thead><tr><th>Date</th><th>Orders</th><th>Revenue</th></tr></thead><tbody id="dailyAnalytics"></tbody></table></div></section></div></main><script src="admin.js"></script></body></html>
