</head><body><header class="navbar"><a class="brand" href="/"><span class="logo">R</span><span><b>RECK SHOP</b><small>Private Order</small></span></a><nav><a href="dashboard.html">Dashboard</a></nav></header><main class="container narrow"><section class="panel"><div class="order-header"><div><span class="eyebrow">PRIVATE ORDER</span><h1 id="number"></h1></div><span id="status" class="status-pill"></span></div><div id="account" class="roblox-result"></div><div id="details" class="details-grid"></div><a id="receiptLink" class="button secondary" target="_blank">Open My Receipt</a><div id="timeline" class="timeline"></div><h2>Support Chat</h2><div id="messages" class="chat-box"></div><div class="search-row"><input id="chat" placeholder="Type a message"><button id="send">Send</button></div></section><section id="reviewPanel" class="panel hidden"><h2>Review this completed order</h2><label>Rating<select id="rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label><label>Comment<textarea id="comment"></textarea></label><button id="review" class="button primary full">Submit Review</button><p id="reviewMessage" class="message"></p></section><p id="message" class="message"></p></main><script src="order.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/service-worker.js").catch(()=>{}));}</script></body></html>
