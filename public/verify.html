<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email | RSR</title><link rel="stylesheet" href="style.css"></head><body><main class="container narrow"><section class="panel"><h1>Email verification</h1><p id="message" class="message">Verifying…</p></section></main><script>(async()=>{const m=document.getElementById("message"),token=new URLSearchParams(location.search).get("token");try{const r=await fetch("/api/auth/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})}),d=await r.json();if(!r.ok)throw new Error(d.error);m.className="message success";m.innerHTML='Email verified. <a href="auth.html">Login</a>'}catch(e){m.className="message error";m.textContent=e.message}})()</script></body></html>
