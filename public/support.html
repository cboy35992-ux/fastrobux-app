<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Center | Reck Shop</title><link rel="stylesheet" href="style.css"><meta name="theme-color" content="#8b5cf6"></head><body><header class="navbar"><a class="brand" href="dashboard.html"><span class="logo">R</span><span><b>RECK SHOP</b><small>Support Center</small></span></a><nav><a href="dashboard.html">Dashboard</a><a href="shop.html">Order</a><a class="active" href="support.html">Support</a></nav></header><main class="container"><section class="hero compact-hero"><span class="eyebrow">PRIVATE CUSTOMER SUPPORT</span><h1>How can we help?</h1><p>Create a ticket for payments, orders, refunds, technical issues or general questions.</p></section><section class="support-layout"><section class="panel"><h2>Create Ticket</h2><label>Category<select id="ticketCategory"><option>Payment</option><option>Order</option><option>Refund</option><option>Technical</option><option>General Question</option></select></label><label>Order Number (optional)<input id="ticketOrder" placeholder="RSR-..."></label><label>Subject<input id="ticketSubject" placeholder="What do you need help with?"></label><label>Message<textarea id="ticketMessage" placeholder="Explain the issue clearly"></textarea></label><button id="createTicket" class="button primary full">Create Ticket</button><p id="ticketMessageState" class="message"></p></section><section class="panel"><h2>My Tickets</h2><div id="ticketList" class="orders-list"><p class="muted">Loading…</p></div></section></section><section id="ticketConversation" class="panel hidden"><div class="order-header"><div><h2 id="ticketTitle">Ticket</h2><p id="ticketMeta" class="muted"></p></div><button id="closeConversation">Close</button></div><div id="ticketMessages" class="ticket-messages"></div><div class="ticket-reply"><textarea id="ticketReply" placeholder="Write a reply"></textarea><button id="sendTicketReply" class="button primary">Send Reply</button></div></section></main><script src="network.js" defer></script><script src="support.js" defer></script><script src="account-state.js" defer></script><script src="mobile-commerce-nav.js" defer></script><script src="i18n.js" defer></script></body></html>
