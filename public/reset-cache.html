<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Reck Shop Cache</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080f1e;color:#fff;font-family:system-ui;padding:20px}
main{width:min(100%,520px);background:#0f172a;border:1px solid #334155;border-radius:20px;padding:28px;text-align:center}
button,a{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#8b5cf6;color:white;font-weight:800;text-decoration:none}
small{color:#94a3b8}
</style></head><body><main><h1>Repair Reck Shop</h1>
<p id="status">Removing the previous website cache and service worker…</p>
<button id="repair">Repair Again</button><a href="/index.html?v=11.2.1">Open Reck Shop</a>
<small>This does not delete your server accounts or orders.</small></main>
<script>
async function repair(){
 const status=document.getElementById("status");
 try{
  if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}
  if("caches" in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}
  localStorage.removeItem("rsr-install-dismissed");
  status.textContent="Repair complete. Opening the fresh homepage…";
  setTimeout(()=>location.replace("/index.html?v=11.2.1.1-reset-"+Date.now()),900);
 }catch(e){status.textContent="Repair could not finish automatically. Clear this site's browser data, then reload."}
}
document.getElementById("repair").onclick=repair;repair();
</script></body></html>
