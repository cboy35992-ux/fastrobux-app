<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connection unavailable | Reck Shop</title><link rel="stylesheet" href="style.css"><meta name="theme-color" content="#8b5cf6"></head><body class="auth-body"><main class="container narrow auth-recovery"><section class="panel center-text"><div class="verification-icon">📡</div><h1>Connection unavailable</h1><p class="muted">This page appears only when the browser could not reach the network and no live server response was available.</p><div id="offlineState" class="server-status waking"><span></span><b>Checking connection…</b></div><button id="retryConnection" class="button primary full">Reconnect</button><a class="button secondary full" href="/">Open Saved Home Page</a></section></main><script src="network.js"></script><script>const state=document.getElementById("offlineState");async function retry(){state.className="server-status waking";state.innerHTML="<span></span><b>Connecting…</b>";const ok=await RSRNetwork.waitForServer({show:true,maxAttempts:8});if(ok)location.href="/";else{state.className="server-status offline";state.innerHTML="<span></span><b>Still unable to connect</b>"}}document.getElementById("retryConnection").onclick=retry;window.addEventListener("online",retry);</script></body></html>
