<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | RSR</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#8b5cf6"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reck Shop">
</head><body><main class="container narrow"><section class="panel"><h1>Reset your password</h1><p class="muted">Enter the email used for your shop account.</p><label>Email<input id="email" type="email"></label><button id="request" class="button primary full">Create Reset Link</button><p id="message" class="message"></p></section></main><script>const $=id=>document.getElementById(id);$("request").onclick=async()=>{try{const r=await fetch("/api/auth/forgot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim()})}),d=await r.json();if(!r.ok)throw new Error(d.error);$("message").className="message success";$("message").innerHTML=d.resetUrl?`Reset link: <a href="${d.resetUrl}">open it here</a>`:d.message}catch(e){$("message").className="message error";$("message").textContent=e.message}}</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/service-worker.js").catch(()=>{}));}</script>
<script src="i18n.js" defer></script>
<script src="install.js" defer></script>
</body></html>
