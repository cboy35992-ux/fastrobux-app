<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | RSR</title><link rel="stylesheet" href="style.css"></head><body><main class="container narrow"><section class="panel"><h1>Reset your password</h1><p class="muted">Enter the email used for your shop account.</p><label>Email<input id="email" type="email"></label><button id="request" class="button primary full">Create Reset Link</button><p id="message" class="message"></p></section></main><script>const $=id=>document.getElementById(id);$("request").onclick=async()=>{try{const r=await fetch("/api/auth/forgot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim()})}),d=await r.json();if(!r.ok)throw new Error(d.error);$("message").className="message success";$("message").innerHTML=d.resetUrl?`Reset link: <a href="${d.resetUrl}">open it here</a>`:d.message}catch(e){$("message").className="message error";$("message").textContent=e.message}}</script></body></html>
