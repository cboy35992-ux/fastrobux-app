<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | RSR</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#8b5cf6"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reck Shop">
</head><body><main class="container narrow"><section class="panel"><h1>Choose a new password</h1><label>New Password<input id="password" type="password"></label><label>Confirm Password<input id="confirmPassword" type="password"></label><button id="reset" class="button primary full">Reset Password</button><p id="message" class="message"></p></section></main><script>const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get("token");$("reset").onclick=async()=>{if($("password").value!==$("confirmPassword").value)return msg("Passwords do not match.");try{const r=await fetch("/api/auth/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:$("password").value})}),d=await r.json();if(!r.ok)throw new Error(d.error);$("message").className="message success";$("message").innerHTML='Password changed. <a href="auth.html">Login now</a>'}catch(e){msg(e.message)}function msg(t){$("message").className="message error";$("message").textContent=t}}</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/service-worker.js").catch(()=>{}));}</script></body></html>
